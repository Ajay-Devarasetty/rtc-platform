# Production stack for a single VM (GCP e2-micro Always Free, or any VPS).
#
# Everything runs on one host because the SFU needs raw UDP on a public IP,
# which serverless platforms do not provide. Caddy terminates TLS and fronts
# both the API and the static frontends on one origin.
#
#   docker compose -f docker-compose.prod.yml --env-file .env.production up -d --build

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - pg_data:/var/lib/postgresql/data
    # Not published to the host — only reachable on the compose network.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --appendonly yes --maxmemory 128mb --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  coturn:
    image: coturn/coturn:latest
    restart: unless-stopped
    network_mode: host
    command: >
      turnserver
      -n
      --log-file=stdout
      --listening-port=3478
      --fingerprint
      --lt-cred-mech
      --user=${TURN_USERNAME}:${TURN_PASSWORD}
      --realm=${DOMAIN}
      --no-cli
      --no-tls
      --no-dtls
      --external-ip=${PUBLIC_IP}
      --min-port=49160
      --max-port=49200

  signaling:
    build:
      context: .
      dockerfile: Dockerfile.signaling
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 4000
      JWT_SECRET: ${JWT_SECRET}
      PUSH_CREDENTIALS_KEY: ${PUSH_CREDENTIALS_KEY:-}
      ADMIN_API_KEY: ${ADMIN_API_KEY}
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      REDIS_URL: redis://redis:6379
      SFU_URL: https://${DOMAIN}/sfu
      RTMP_INGEST_URL: rtmp://127.0.0.1/live
      HLS_PUBLIC_URL: https://${DOMAIN}/hls
      TURN_URL: turn:${DOMAIN}:3478
      TURN_USERNAME: ${TURN_USERNAME}
      TURN_PASSWORD: ${TURN_PASSWORD}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      DEMO_APP_SECRET: ${DEMO_APP_SECRET:-}
      RECORDINGS_DIR: /data/recordings
    volumes:
      - recordings:/data/recordings
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:4000/ready"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s

  media-sfu:
    build:
      context: .
      dockerfile: Dockerfile.media-sfu
    restart: unless-stopped
    # Host networking so mediasoup can bind its UDP range directly. Port
    # mapping a 100-port UDP range through the proxy is slow to start and
    # breaks ICE candidate addressing.
    network_mode: host
    environment:
      NODE_ENV: production
      PORT: 4100
      SIGNALING_URL: https://${DOMAIN}
      JWT_SECRET: ${JWT_SECRET}
      # Must be the VM's public IP — browsers send media here directly.
      ANNOUNCED_IP: ${PUBLIC_IP}
      RTMP_INGEST_URL: rtmp://127.0.0.1/live
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:4100/ready"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s

  rtmp-ingest:
    image: alfg/nginx-rtmp
    restart: unless-stopped
    network_mode: host
    volumes:
      - ./infra/nginx-rtmp/nginx.conf:/etc/nginx/nginx.conf:ro

  # Copies freshly built static files from the image into the shared volume.
  web-build:
    build:
      context: .
      dockerfile: Dockerfile.web
      args:
        VITE_DEMO_APP_SECRET: ${DEMO_APP_SECRET:-}
    volumes:
      - web_dist:/out

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: ${DOMAIN}
      TLS_EMAIL: ${TLS_EMAIL}
    # media-sfu binds the host network for its UDP range, so Caddy reaches it
    # through the host gateway rather than a compose service name.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - web_dist:/srv:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - signaling
      - web-build

volumes:
  pg_data:
  redis_data:
  recordings:
  web_dist:
  caddy_data:
  caddy_config:
