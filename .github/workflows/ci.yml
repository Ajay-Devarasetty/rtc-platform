name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: rtc_test
          POSTGRES_PASSWORD: rtc_test_password
          POSTGRES_DB: rtc_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U rtc_test -d rtc_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build protocol
        run: npm run build -w @rtc/protocol

      - name: Build SDK
        run: npm run build -w @rtc/sdk

      - name: Build signaling
        run: npm run build -w @rtc/signaling

      - name: Build media-sfu
        run: npm run build -w @rtc/media-sfu

      - name: Test signaling
        run: npm run test -w @rtc/signaling

      - name: Test media authorization
        run: node --test packages/media-sfu/dist/auth.test.js

      - name: Test account security with PostgreSQL
        run: node scripts/test-database.mjs
        env:
          TEST_DATABASE_URL: postgresql://rtc_test:rtc_test_password@localhost:5432/rtc_test

      - name: Build browser applications
        run: npm run build -w @rtc/demo && npm run build -w @rtc/dashboard

      - name: Verify npm packages
        run: |
          npm pack -w @rtc/protocol --dry-run
          npm pack -w @rtc/sdk --dry-run
